<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        /* Fundo preto absoluto e texto branco para não dar erro de renderização no LED */
        body { 
            background: #000; 
            color: #FFF; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }
        /* Ajuste o tamanho aqui: se o número sumir, diminua o valor */
        #temp { 
            font-size: 200px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div id="temp">--°</div>

    <script>
        // Função direta sem frescuras para o player da TB40
        async function getClima() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-8.684&longitude=-35.591&current=temperature_2m&timezone=auto');
                const data = await response.json();
                const valor = Math.round(data.current.temperature_2m);
                document.getElementById('temp').innerHTML = valor + '°';
            } catch (e) {
                // Em caso de erro, tenta de novo em 30 segundos
                setTimeout(getClima, 30000);
            }
        }

        getClima();
        // Atualiza a cada 5 minutos (mais seguro para o hardware da TB40)
        setInterval(getClima, 300000);
    </script>
</body>
</html>
