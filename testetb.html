<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { 
            background: #000; 
            color: #FFF; 
            font-family: "Arial Black", Gadget, sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 93px; 
            height: 28px;
            overflow: hidden; 
        }
        
        #temp { 
            font-size: 24px; /* Tamanho quase no limite da altura de 28px */
            font-weight: bold;
            line-height: 28px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="temp">--°</div>

    <script>
        async function getClima() {
            try {
                // Latitude e Longitude de Palmares-PE
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=-8.684&longitude=-35.591&current=temperature_2m&timezone=auto';
                const response = await fetch(url);
                const data = await response.json();
                const valor = Math.round(data.current.temperature_2m);
                
                // Exibe o número e o símbolo de grau
                document.getElementById('temp').innerHTML = valor + '°';
            } catch (e) {
                // Em caso de erro (sem internet), tenta novamente em 30s
                setTimeout(getClima, 30000);
            }
        }

        getClima();
        // Atualiza a cada 10 minutos
        setInterval(getClima, 600000);
    </script>
</body>
</html>
